services:
  coupon-api:
    build:
      context: .
      args:
        SKIP_TESTS: "false"
    image: desafio-tecnico/coupon-api:latest
    container_name: coupon-api
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
      SPRING_H2_CONSOLE_SETTINGS_WEB_ALLOW_OTHERS: "true"
    restart: unless-stopped
